<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 3</title>
</head>

<body>
    <h1>Calcular quantas vezes preciso jogar dois dados até os números saírem iguais</h1>

    <script>
        let dado1 = 0
        let dado2 = 0
        let cont = 0
        let n = 0

        do {
            dado1 = parseInt(Math.random() * 6 + 1)
            dado2 = parseInt(Math.random() * 6 + 1)

            document.write(dado1 + " | " + dado2 + "<br>")

            cont++
        } while (dado1 != dado2)

        document.write("<br> Os dados foram jogados " + cont + " vez(es) até cair números iguais (" + dado1 + ")")

    </script>
</body>

</html>
