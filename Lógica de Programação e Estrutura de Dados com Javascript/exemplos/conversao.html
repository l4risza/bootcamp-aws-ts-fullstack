<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversão</title>

    <style>
        body {
            background-color: #ccc;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <h1>Conversão - Números e String</h1>
    <h1>Imprimir "banana" sem digitar tudo na String</h1>

    <script src="introducao.js"></script>

    <script>
        alert("Soma de números")

        let num1 = prompt("Digite um número:")
        num1 = parseFloat(num1) //convertendo para float na mesma variável (se não seria considerado string)
        let num2 = prompt("Digite outro número:")
        num2 = parseFloat(num2)

        //Tipos: Number(), parseInt(), parseFloat()

        alert("Se não criarmos uma variável soma, os números são lidos como String")
        alert("A soma dos números é: " + num1+num2) 
    

        let soma = num1 + num2 //PRECISA ser var pq juntar número e texto vira texto automaticamente ("soma: " + 2+3 -> "soma: 23")
        alert("Agora com a variável soma...")
        alert("A soma dos números é: " + soma + "!") 
    </script>

    <h3>String "Ba" + tentativa de transformar String em número (NaN) + "a"</h3>

    <script>
        let str = "Ba"

        str += parseInt(str) //retorna NaN pois na str não contém número

        str += "a"

        alert(str) //BaNaNa
        alert(str.toLowerCase()) //banana
    </script>

</body>

</html>
