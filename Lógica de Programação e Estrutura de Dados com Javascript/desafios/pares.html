<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4</title>
</head>

<body>
    <h1>Mostrar todos os números pares do 2 até o número digitado pelo usuário</h1>

    <script>
        let n = parseInt(prompt("Digite um número:"))
        let cont = 0

        for(let i = 2; i <= n; i++){
            if(i % 2 == 0){
                document.write(i + "<br>")
            }
        }
    </script>
</body>

</html>
