<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 2</title>

    <style>
        body {
            background-color: #ccc;
            font-family: sans-serif;
        }
    </style>
</head>

<body>
    <h1>Definir uma variável (no código) e encontrar o tipo dela usando switch-case</h1>

    <script>
        let variavel = undefined
        let tipovar = (typeof variavel)

        switch (variavel) {
            case 5:
                alert("Variável " + variavel + " é número")
                break
            case '5':
                alert("Variável " + variavel + " é String")
                break
            case true:
                alert("Variável " + variavel + " é boolean")
                break
            case false:
                alert("Variável " + variavel + " é boolean")
                break
            case null:
                alert("Variável " + variavel + " é nula")
                break
            case undefined:
                alert("Variável " + variavel + " é indefinida")
                break
            default:
                alert("Variável " + variavel + " é de um tipo desconhecido")
        }

        //OU
        alert("OUTRA FORMA DE FAZER (sem switch-case)")

        alert("Variável " + variavel + " é do tipo " + tipovar)

    </script>
</body>

</html>
